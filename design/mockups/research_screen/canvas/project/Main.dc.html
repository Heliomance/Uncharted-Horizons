<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Research screen, late game</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'DejaVu Sans UH';src:url(/_blob/fb9b8db9ae8cc8c9a4a5e48e5792a2b5) format('woff2');font-weight:400;font-style:normal}
body{margin:0;background:#000033}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left;line-height:inherit}
.uh-chip:hover{border-color:#FFFFFF !important}
.uh-btn:hover:not([disabled]){background:#65DC72 !important;color:#404040 !important}
.uh-btn:active:not([disabled]){background:#409955 !important;color:#000033 !important}
.uh-row:hover{background:#252B3E}
.uh-link:hover{color:#FFFFFF !important}
button:focus-visible{outline:2px solid #3A98DB !important;outline-offset:1px}
.uh-scroll{scrollbar-width:thin;scrollbar-color:#334D80 transparent}
.uh-scroll::-webkit-scrollbar{width:10px;height:10px}
.uh-scroll::-webkit-scrollbar-thumb{background:#334D80;border-radius:5px}
.uh-scroll::-webkit-scrollbar-track{background:transparent}
a{color:#4893AF}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="{{rootStyle}}">

<!-- LEFT COLUMN: what is funded, and every focus the civilisation has entered -->
<div style="{{L.leftStyle}}">
  <button aria-label="{{fund.aria}}" onClick="{{fund.onClick}}" style="{{fund.style}}">
    <span style="display:flex;align-items:center;gap:6px;height:24px;padding-left:3px">
      <svg width="16" height="16" viewBox="0 0 14 14" aria-hidden="true"><path d="M5 1.5h4M5.8 1.5v4L2.2 11.6c-.4.7.1 1.4.9 1.4h7.8c.8 0 1.3-.7.9-1.4L8.2 5.5v-4" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path><path d="M3.6 9.5h6.8" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"></path></svg>
      <span style="font-size:18px">{{fund.insight}} Insight a turn</span>
    </span>
    <sc-if value="{{fund.isFocus}}" hint-placeholder-val="{{ true }}">
      <span style="display:flex;align-items:center;gap:5px;height:28px;box-sizing:border-box;border-radius:14px;background:#4893AF;border:1.5px solid #B3B3B3;color:#000033;padding:0 8px 0 4px">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="#000033" stroke-width="1.5"></circle><circle cx="8" cy="8" r="3.5" fill="#000033"></circle></svg>
        <span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{fund.name}}</span>
        <span style="white-space:nowrap">{{fund.right}}</span>
      </span>
    </sc-if>
    <sc-if value="{{fund.isEndeavour}}" hint-placeholder-val="{{ false }}">
      <span style="display:flex;flex-direction:column;justify-content:center;gap:3px;height:28px;box-sizing:border-box;border-radius:14px;background:#334D80;border:2px solid #FFFFFF;color:#FFFFFF;padding:0 10px 0 4px">
        <span style="display:flex;align-items:center;gap:6px;height:16px">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7.5" fill="#FFFFFF"></circle><path d="M3.6 11.3h8.8L8 4.2z" fill="none" stroke="#000033" stroke-width="1.4" stroke-linejoin="round"></path><path d="M5.4 8.4h5.2" stroke="#000033" stroke-width="1.1"></path></svg>
          <span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{fund.name}}</span>
          <span>{{fund.right}}</span>
        </span>
      </span>
      <span style="display:block;position:relative;height:4px;margin:-8px 12px 4px 26px;background:rgba(255,255,255,0.25);border-radius:2px">
        <span style="{{fund.barFill}}"></span>
        <span style="position:absolute;left:25%;top:0;width:1px;height:4px;background:#000033"></span>
        <span style="position:absolute;left:50%;top:0;width:1px;height:4px;background:#000033"></span>
        <span style="position:absolute;left:75%;top:0;width:1px;height:4px;background:#000033"></span>
      </span>
    </sc-if>
    <span style="display:flex;align-items:center;height:20px;box-sizing:border-box;border-radius:10px;border:1px dashed #B3B3B3;color:#B3B3B3;padding:0 9px 0 12px;margin-top:2px">
      <span style="flex:1;white-space:nowrap">Spread to other foci</span><span style="margin-left:8px;white-space:nowrap">{{fund.spread}}</span>
    </span>
  </button>

  <div role="radiogroup" aria-label="Fund a focus" class="uh-scroll" ref="{{L.listRef}}" style="{{L.listStyle}}">
    <sc-for list="{{foci}}" as="f" hint-placeholder-count="33">
      <div class="uh-row" style="{{f.rowStyle}}" onContextMenu="{{f.onQueue}}">
        <button role="radio" aria-checked="{{f.checked}}" aria-label="{{f.radioAria}}" onClick="{{f.onFund}}" style="{{L.radioStyle}}">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.75" fill="none" stroke="{{f.ring}}" stroke-width="1.5"></circle><circle cx="7" cy="7" r="3" fill="{{f.dot}}"></circle></svg>
        </button>
        <button aria-label="{{f.selectAria}}" onClick="{{f.onSelect}}" style="{{f.nameStyle}}">{{f.name}}</button>
        <sc-if value="{{f.showPyramid}}" hint-placeholder-val="{{ false }}">
          <svg width="16" height="16" viewBox="0 0 16 16" role="img" aria-label="holds the Grand Endeavour" style="margin-left:4px;flex:none"><circle cx="8" cy="8" r="7.5" fill="#FFFFFF"></circle><path d="M3.6 11.3h8.8L8 4.2z" fill="none" stroke="#000033" stroke-width="1.4" stroke-linejoin="round"></path><path d="M5.4 8.4h5.2" stroke="#000033" stroke-width="1.1"></path></svg>
        </sc-if>
        <sc-if value="{{f.showNew}}" hint-placeholder-val="{{ false }}">
          <span style="margin-left:4px;height:15px;line-height:15px;border-radius:7.5px;padding:0 5px;background:#FFFFFF;color:#000033;flex:none">New</span>
        </sc-if>
        <sc-if value="{{f.showBadge}}" hint-placeholder-val="{{ false }}">
          <span title="{{f.badgeTitle}}" style="{{f.badgeStyle}}">{{f.badge}}</span>
        </sc-if>
        <sc-if value="{{f.showQueue}}" hint-placeholder-val="{{ false }}">
          <span title="{{f.queueTitle}}" style="margin-left:4px;width:16px;height:16px;box-sizing:border-box;border-radius:8px;border:1.5px solid #FFFFFF;background:rgba(0,64,133,0.75);color:#FFFFFF;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1">{{f.queueNo}}</span>
        </sc-if>
      </div>
    </sc-for>
  </div>
  <sc-if value="{{showHint}}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;align-items:center;gap:6px;margin:9px 0 0 3px;color:#B3B3B3">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.75" fill="none" stroke="#B3B3B3" stroke-width="1.5"></circle></svg>
      <span>funds · right-click queues</span>
    </div>
  </sc-if>
</div>

<div style="width:3px;flex:none;box-sizing:border-box;background:#334D80;border-left:1px solid #19263F;border-right:1px solid #19263F"></div>

<!-- RIGHT: filter row, board, bottom bar -->
<div style="flex:1;min-width:0;display:flex;flex-direction:column">
  <div style="{{L.topStyle}}">
    <sc-for list="{{segs}}" as="sg" hint-placeholder-count="5">
      <button aria-pressed="{{sg.pressed}}" aria-label="{{sg.aria}}" onClick="{{sg.onClick}}" style="{{sg.style}}">
        <sc-if value="{{sg.g.studying}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7.5" fill="#FFFFFF"></circle><g transform="translate(2.3 2.1) scale(.82)"><path d="M5 1.5h4M5.8 1.5v4L2.2 11.6c-.4.7.1 1.4.9 1.4h7.8c.8 0 1.3-.7.9-1.4L8.2 5.5v-4" fill="none" stroke="#000033" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path><path d="M3.6 9.5h6.8" stroke="#000033" stroke-width="1.7" stroke-linecap="round"></path></g></svg></sc-if>
        <sc-if value="{{sg.g.waiting}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2.2 1.6"></circle><circle cx="7" cy="7" r="1.6" fill="#FFFFFF"></circle></svg></sc-if>
        <sc-if value="{{sg.g.unreach}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.75" y="6.25" width="8.5" height="6.25" rx="1.2" fill="none" stroke="#FFFFFF" stroke-width="1.5"></rect><path d="M4.8 6.25V4.5a2.2 2.2 0 0 1 4.4 0v1.75" fill="none" stroke="#FFFFFF" stroke-width="1.5"></path></svg></sc-if>
        <sc-if value="{{sg.g.closed}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.25" y="2.25" width="9.5" height="9.5" rx="1.5" fill="none" stroke="#B3B3B3" stroke-width="1.5"></rect><path d="M2.5 5.6h9M2.5 8.4h9" stroke="#B3B3B3" stroke-width="1.3"></path></svg></sc-if>
        <sc-if value="{{sg.g.owned}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="1.5" y="3.5" width="11" height="7" rx="3.5" fill="#FFD700" stroke="#B3B3B3"></rect></svg></sc-if>
        <sc-if value="{{L.segLabels}}" hint-placeholder-val="{{ true }}"><span>{{sg.label}}</span></sc-if>
        <span style="{{sg.countStyle}}">{{sg.count}}</span>
      </button>
    </sc-for>
    <span style="flex:1"></span>
    <sc-if value="{{L.ftlTop}}" hint-placeholder-val="{{ false }}"><button class="uh-btn" aria-label="Open the Faster than light screen" style="{{L.ftlTopStyle}}">Faster than light</button></sc-if>
    <button aria-label="{{era.aria}}" onClick="{{era.onClick}}" style="{{era.style}}">{{era.text}}</button>
  </div>

  <div class="uh-scroll" style="{{boardStyle}}">
    <!-- the focus view's header -->
    <sc-if value="{{fv.show}}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:center;gap:10px;height:30px;margin-bottom:6px">
        <button role="radio" aria-checked="{{fv.checked}}" aria-label="{{fv.radioAria}}" onClick="{{fv.onFund}}" style="width:20px;height:20px;display:flex;align-items:center;justify-content:center">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="#FFFFFF" stroke-width="1.5"></circle><circle cx="8" cy="8" r="3.5" fill="{{fv.dot}}"></circle></svg>
        </button>
        <span style="font-size:18px">{{fv.name}}</span>
        <span style="color:#B3B3B3">{{fv.summary}}</span>
        <span style="flex:1"></span>
        <button class="uh-btn" onClick="{{fv.onBack}}" style="height:30px;border-radius:15px;background:#334D80;color:#FFFFFF;padding:0 13px">× All foci</button>
      </div>
    </sc-if>

    <!-- live sections: Grand Endeavour, Being studied, Awaiting the idea, Not yet reachable, Moment passed -->
    <sc-for list="{{sections}}" as="sec" hint-placeholder-count="4">
      <div style="margin-bottom:4px">
        <button aria-expanded="{{sec.expandedStr}}" onClick="{{sec.onToggle}}" style="{{L.secHeadStyle}}">
          <sc-if value="{{sec.g.endeavour}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7.5" fill="#FFFFFF"></circle><path d="M3.6 11.3h8.8L8 4.2z" fill="none" stroke="#000033" stroke-width="1.4" stroke-linejoin="round"></path><path d="M5.4 8.4h5.2" stroke="#000033" stroke-width="1.1"></path></svg></sc-if>
          <sc-if value="{{sec.g.studying}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7.5" fill="#FFFFFF"></circle><g transform="translate(2.3 2.1) scale(.82)"><path d="M5 1.5h4M5.8 1.5v4L2.2 11.6c-.4.7.1 1.4.9 1.4h7.8c.8 0 1.3-.7.9-1.4L8.2 5.5v-4" fill="none" stroke="#000033" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path><path d="M3.6 9.5h6.8" stroke="#000033" stroke-width="1.7" stroke-linecap="round"></path></g></svg></sc-if>
          <sc-if value="{{sec.g.waiting}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2.2 1.6"></circle><circle cx="7" cy="7" r="1.6" fill="#FFFFFF"></circle></svg></sc-if>
          <sc-if value="{{sec.g.unreach}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.75" y="6.25" width="8.5" height="6.25" rx="1.2" fill="none" stroke="#FFFFFF" stroke-width="1.5"></rect><path d="M4.8 6.25V4.5a2.2 2.2 0 0 1 4.4 0v1.75" fill="none" stroke="#FFFFFF" stroke-width="1.5"></path></svg></sc-if>
          <sc-if value="{{sec.g.closed}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.25" y="2.25" width="9.5" height="9.5" rx="1.5" fill="none" stroke="#B3B3B3" stroke-width="1.5"></rect><path d="M2.5 5.6h9M2.5 8.4h9" stroke="#B3B3B3" stroke-width="1.3"></path></svg></sc-if>
          <span style="font-size:18px;margin-left:8px">{{sec.title}}</span>
          <span style="font-size:18px;margin-left:8px;color:#B3B3B3">{{sec.count}}</span>
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" style="margin-left:7px"><path d="{{sec.chevron}}" fill="none" stroke="#B3B3B3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <sc-if value="{{L.showWhy}}" hint-placeholder-val="{{ true }}"><span style="margin-left:14px;color:#B3B3B3">{{sec.why}}</span></sc-if>
        </button>
        <sc-if value="{{sec.showRuns}}" hint-placeholder-val="{{ true }}">
          <div style="{{L.runsStyle}}">
            <sc-for list="{{sec.runs}}" as="run" hint-placeholder-count="6">
              <div style="display:flex;align-items:flex-start;max-width:100%">
                <button aria-label="{{run.aria}}" onClick="{{run.onSelect}}" style="{{run.labelStyle}}">{{run.label}}</button>
                <div style="{{L.chipsStyle}}">
                  <sc-for list="{{run.chips}}" as="c" hint-placeholder-count="2">
                    <button class="uh-chip" aria-label="{{c.aria}}" onClick="{{c.onClick}}" style="{{c.style}}">
                      <sc-if value="{{c.g.endeavour}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7.5" fill="#FFFFFF"></circle><path d="M3.6 11.3h8.8L8 4.2z" fill="none" stroke="#000033" stroke-width="1.4" stroke-linejoin="round"></path><path d="M5.4 8.4h5.2" stroke="#000033" stroke-width="1.1"></path></svg></sc-if>
                      <sc-if value="{{c.g.studying}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7.5" fill="#FFFFFF"></circle><g transform="translate(2.3 2.1) scale(.82)"><path d="M5 1.5h4M5.8 1.5v4L2.2 11.6c-.4.7.1 1.4.9 1.4h7.8c.8 0 1.3-.7.9-1.4L8.2 5.5v-4" fill="none" stroke="#000033" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path><path d="M3.6 9.5h6.8" stroke="#000033" stroke-width="1.7" stroke-linecap="round"></path></g></svg></sc-if>
                      <sc-if value="{{c.g.waiting}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2.2 1.6"></circle><circle cx="7" cy="7" r="1.6" fill="#FFFFFF"></circle></svg></sc-if>
                      <sc-if value="{{c.g.unreach}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.75" y="6.25" width="8.5" height="6.25" rx="1.2" fill="none" stroke="#FFFFFF" stroke-width="1.5"></rect><path d="M4.8 6.25V4.5a2.2 2.2 0 0 1 4.4 0v1.75" fill="none" stroke="#FFFFFF" stroke-width="1.5"></path></svg></sc-if>
                      <sc-if value="{{c.g.closed}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.25" y="2.25" width="9.5" height="9.5" rx="1.5" fill="none" stroke="#B3B3B3" stroke-width="1.5"></rect><path d="M2.5 5.6h9M2.5 8.4h9" stroke="#B3B3B3" stroke-width="1.3"></path></svg></sc-if>
                      <span>{{c.name}}</span>
                      <sc-if value="{{c.era.show}}" hint-placeholder-val="{{ true }}"><span style="{{c.era.style}}">{{c.era.text}}</span></sc-if>
                      <sc-for list="{{c.tags}}" as="t" hint-placeholder-count="0"><span style="{{t.style}}">{{t.text}}</span></sc-for>
                    </button>
                  </sc-for>
                </div>
              </div>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{sec.showCards}}" hint-placeholder-val="{{ false }}">
          <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:8px 12px">
            <sc-for list="{{sec.cards}}" as="c" hint-placeholder-count="2">
              <button class="uh-chip" aria-label="{{c.aria}}" onClick="{{c.onClick}}" style="{{c.cardStyle}}">
                <span style="display:flex;align-items:center;gap:5px;height:20px">
                  <sc-if value="{{c.g.endeavour}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7.5" fill="#FFFFFF"></circle><path d="M3.6 11.3h8.8L8 4.2z" fill="none" stroke="#000033" stroke-width="1.4" stroke-linejoin="round"></path><path d="M5.4 8.4h5.2" stroke="#000033" stroke-width="1.1"></path></svg></sc-if>
                  <sc-if value="{{c.g.studying}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7.5" fill="#FFFFFF"></circle><g transform="translate(2.3 2.1) scale(.82)"><path d="M5 1.5h4M5.8 1.5v4L2.2 11.6c-.4.7.1 1.4.9 1.4h7.8c.8 0 1.3-.7.9-1.4L8.2 5.5v-4" fill="none" stroke="#000033" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path><path d="M3.6 9.5h6.8" stroke="#000033" stroke-width="1.7" stroke-linecap="round"></path></g></svg></sc-if>
                  <sc-if value="{{c.g.waiting}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2.2 1.6"></circle><circle cx="7" cy="7" r="1.6" fill="#FFFFFF"></circle></svg></sc-if>
                  <sc-if value="{{c.g.unreach}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.75" y="6.25" width="8.5" height="6.25" rx="1.2" fill="none" stroke="#FFFFFF" stroke-width="1.5"></rect><path d="M4.8 6.25V4.5a2.2 2.2 0 0 1 4.4 0v1.75" fill="none" stroke="#FFFFFF" stroke-width="1.5"></path></svg></sc-if>
                  <sc-if value="{{c.g.closed}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.25" y="2.25" width="9.5" height="9.5" rx="1.5" fill="none" stroke="#B3B3B3" stroke-width="1.5"></rect><path d="M2.5 5.6h9M2.5 8.4h9" stroke="#B3B3B3" stroke-width="1.3"></path></svg></sc-if>
                  <sc-if value="{{c.g.notTaken}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 12.5V8.3L7 5V1.5M7 5l4.5 3.6" fill="none" stroke="#9C9CB4" stroke-width="1.5" stroke-linecap="round"></path><path d="M8.6 10.9l2.6-3" stroke="#9C9CB4" stroke-width="1.5" stroke-linecap="round"></path></svg></sc-if>
                  <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{c.name}}</span>
                  <sc-if value="{{c.era.show}}" hint-placeholder-val="{{ true }}"><span style="{{c.era.style}}">{{c.era.text}}</span></sc-if>
                  <sc-for list="{{c.tags}}" as="t" hint-placeholder-count="0"><span style="{{t.style}}">{{t.text}}</span></sc-for>
                </span>
                <span style="{{c.line2Style}}">{{c.line2}}</span>
              </button>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </sc-for>

    <!-- the owned history, newest era first, in Unciv's era-header colours -->
    <sc-if value="{{owned.show}}" hint-placeholder-val="{{ true }}">
      <button aria-expanded="{{owned.expandedStr}}" onClick="{{owned.onToggle}}" style="{{L.secHeadStyle}}">
        <svg width="16" height="16" viewBox="0 0 14 14" aria-hidden="true"><rect x="1.5" y="3.5" width="11" height="7" rx="3.5" fill="#FFD700" stroke="#B3B3B3"></rect></svg>
        <span style="font-size:18px;margin-left:8px">Owned</span>
        <span style="font-size:18px;margin-left:8px;color:#B3B3B3">{{owned.count}}</span>
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" style="margin-left:7px"><path d="{{owned.chevron}}" fill="none" stroke="#B3B3B3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <sc-if value="{{L.showWhy}}" hint-placeholder-val="{{ true }}"><span style="margin-left:14px;color:#B3B3B3">{{owned.why}}</span></sc-if>
      </button>
      <sc-if value="{{owned.expanded}}" hint-placeholder-val="{{ true }}">
        <sc-for list="{{owned.bands}}" as="band" hint-placeholder-count="3">

        parts.push({ text: met ? '✓ ' : '✗ ', style: 'color:' + (met ? '#65DC72' : '#FF6B6B') });
        let t = n.label;
        if (!met && n.ref && byId[n.ref] && byId[n.ref].status === 'studying') t += ' (under study in ' + byId[n.ref].focus + ')';
        parts.push(t);
      });
      line(parts);
    };
    const quote = t => t && grey('“' + t + '”');
    const enBtn = r => {
      const p = (r.id === (en && en.id)) ? null : this.price(r);
      act('secondary', en ? 'Replace the Endeavour' : 'Begin Grand Endeavour', fmt(p.price) + ' Insight · about ' + p.turns + (p.turns === 1 ? ' turn' : ' turns'),
        () => this.setState({ popup: { kind: en ? 'replace' : 'begin', id: r.id } }));
    };

    if (sel.kind === 'row' && byId[sel.id]) {
      const r = byId[sel.id], fundedHere = r.focus === st.funded && !en;
      G[{ owned: 'owned', studying: 'studying', waiting: 'waiting', unreach: 'unreach', closed: 'closed', not_taken: 'notTaken', endeavour: 'endeavour' }[r.status]] = true;
      b.title = r.name;
      b.meta = r.focus + ' · ' + r.era + ' era' + (r.status === 'endeavour' ? ' · Grand Endeavour' : '') + (r.also && r.also.length ? ' · also reached by ' + r.also.join(', ') : '');
      b.tags = (r.tags || []).filter(t => t === 'New').map(t => ({ text: t, style: TAG_BASE + TAG[t] + 'margin-left:8px' }));
      const src = r.src ? r.src + '. ' : '';
      if (r.status === 'owned') {
        line(['Discovered on turn ' + r.turn + '. ' + (r.fx || '')]);
        if (r.fx2) line([r.fx2]);
        if (r.opens) line(['Opens the ' + r.opens + ' focus.']);
        if ((r.tags || []).includes('Superseded')) line(['Superseded by ' + r.by + ': its buildings are no longer available.']);
        if ((r.tags || []).includes('Dead end')) line(['Dead end: Mechanical Equivalent of Heat reported that heat is motion, not a fluid.']);
        if ((r.tags || []).includes('Unique')) line(['Unique to your civilisation: it cannot be traded or stolen, and never diffuses.']);
        if ((r.tags || []).includes('Rare')) line(['A rare find.']);
        needsLine(r);
        if ((r.tags || []).includes('FTL')) line(['This bore on the question of how to exceed the speed of light.']);
        if (r.flav) grey(r.flav);
        act('primary', 'Discovered', '', null, true);
        if ((r.tags || []).includes('FTL')) act('secondary', 'Open the FTL screen', '', null, false);
      } else if (r.status === 'studying') {
        line([fundedHere ? 'Being studied in ' + r.focus + ', which you fund: it takes Insight every turn.' : 'Being studied in ' + r.focus + ': it takes a share of that focus’s Insight every turn.']);
        if (r.competes) line(['Competes with ' + r.competes + ', also under study: if that comes first, this is never developed.']);
        needsLine(r);
        quote(r.conj);
        if (fundedHere) act('primary', 'Funded', '', null, true); else act('primary', 'Fund ' + r.focus, '', () => this.fund(r.focus));
        enBtn(r);
      } else if (r.status === 'waiting') {
        line([src + 'Awaiting the idea: no Insight, however hard ' + r.focus + ' is funded, until the idea occurs.']);
        needsLine(r, 'Needs ');
        if (r.competes) line(['Competes with ' + r.competes + ', under study: if that comes first, this is never developed.']);
        quote(r.conj);
        act('primary', 'Experiment', '300 Gold · Scientific Method', null, false);
        enBtn(r);
      } else if (r.status === 'unreach') {
        line([src + 'Not yet reachable: a prerequisite must be discovered first.']);
        needsLine(r);
        line(['It cannot be a Grand Endeavour until ' + (r.needs_name || 'its prerequisites') + ' ' + (r.needs_name ? 'is' : 'are') + ' discovered.']);
        quote(r.conj);
        if (r.needs_focus) act('primary', 'Fund ' + r.needs_focus, '', () => this.fund(r.needs_focus)); else act('primary', 'Not yet reachable', '', null, true);
        act('secondary', 'Grand Endeavour', 'needs ' + (r.needs_name || 'a prerequisite') + ' first', null, true);
      } else if (r.status === 'closed') {
        line([src + 'Its moment passed — only an Endeavour is certain. It takes no Insight now.']);
        needsLine(r);
        const p = this.price(r), ahead = EO.indexOf(r.era) > EO.indexOf(S.devEra);
        line(['As an Endeavour: ' + fmt(p.price) + ' Insight, twice today’s price' + (ahead ? ', falling as development catches up.' : '; about ' + p.turns + (p.turns === 1 ? ' turn' : ' turns') + ' at ' + fmt(this.share()) + ' a turn.')]);
        quote(r.conj);
        act('primary', 'Synthesis', 'once this era · unused', null, false);
        enBtn(r);
      } else if (r.status === 'not_taken') {
        line([src + 'Path not taken: ' + r.instead + ' was discovered first, so this will never be developed.']);
        grey('A thing your civilisation glimpsed and let slip.');
        quote(r.conj);
        act('primary', 'Never developed', '', null, true);
      } else if (r.status === 'endeavour') {
        line([en.pct + '% complete — ' + fmt(en.paid) + ' of ' + fmt(en.price) + ' Insight; about ' + Math.max(1, Math.ceil((en.price - en.paid) / this.share())) + ' more turns at ' + fmt(this.share()) + ' a turn. It cannot fail.']);
        line(['It takes the funded share; the 20% spread still reaches your other foci.']);
        line(['Milestones at 25%, 50% and 75% may bring spin-offs. Committed on turn ' + en.committed + '.']);
        grey('Stopping it lets its progress decay slowly; you can resume it later.');
        act('primary', 'Endeavour under way', en.pct + '%', null, true);
        act('secondary', 'Stop the Endeavour', '', () => this.setState({ popup: { kind: 'stop' } }));
      }
    } else if (sel.kind === 'focus') {
      const f = sel.id, isF = f === st.funded && !en, qi = st.queue.indexOf(f);
      G.focus = true; b.dot = isF ? '#FFFFFF' : 'none'; b.title = f;
      b.meta = isF ? 'funded · 80% of your Insight' : 'not funded' + (qi >= 0 ? ' · queued ' + ORD(qi + (st.funded || en ? 2 : 1)) : '');
      const studying = Object.values(byId).filter(r => r.status === 'studying' && (r.focus === f || (r.also || []).includes(f))).map(r => r.name);
      line([studying.length ? 'Under study here: ' + studying.join(', ') + '.' : 'Nothing revealed is under study here.']);
      const mods = (D.mods[f] || []).concat(D.mods['*'] || []);
      line(['Tends to help with ' + (D.help[f] || 'a little of everything') + '.' + (mods.length ? ' Modifiers: ' + mods.join(', ') + '.' : '')]);
      if (qi >= 0) line(['Queued ' + ORD(qi + (st.funded || en ? 2 : 1)) + ': funding moves here when ' + (st.funded || 'the Endeavour') + ' has no revealed work under study.']);
      grey('Switching loses nothing: every breakthrough keeps its progress.');
      if (qi >= 0) b.move = { show: true, upAria: 'Move ' + f + ' up the queue', downAria: 'Move ' + f + ' down the queue', onUp: () => this.moveQueue(f, -1), onDown: () => this.moveQueue(f, 1) };
      if (isF) act('primary', 'Funded', '', null, true); else act('primary', 'Fund ' + f, en ? 'sets the Endeavour aside' : '', () => this.fund(f));
      if (!isF) act('secondary', qi >= 0 ? 'Remove from queue' : 'Add to queue', '', () => this.toggleQueue(f));
    } else if (sel.kind === 'funding') {
      G.insight = true; b.title = 'Insight'; b.meta = fmt(this.insight()) + ' a turn, equal to your science';
      line([(en ? 'The Endeavour takes 80% (' : '80% (') + fmt(this.share()) + ') ' + (en ? '' : 'goes to the funded focus, ') + 'since Specialization of Labor; before it, 50%.']);
      line(['The other 20% (' + fmt(this.spread()) + ') spreads to foci with work under study. Switching loses nothing.']);
      const qs = st.queue.map((f, i) => (i + (st.funded || en ? 2 : 1)) + ' ' + f).join(', ');
      line(['Queue: ' + (qs || 'empty') + '. It moves on when the funded focus has no revealed work under study.']);
      line(['Diffusion: after the press (Printing Press). Theories reveal their applications (Scientific Method).']);
      line(['Abilities: Experiment (Scientific Method) · Synthesis (Dialectical Thinking), unused this era.']);
      act('primary', en ? 'Grand Endeavour' : 'Funded: ' + st.funded, '', null, true);
    } else if (sel.kind === 'era') {
      b.title = S.era + ' era'; b.meta = 'entered by count';
      S.eraLines.forEach(t => line([t]));
    }
    return b;
  }

  popupVM(byId, en) {
    const p = this.state.popup;
    if (!p) return { show: false, ok: {}, cancel: {} };
    const keep = { label: 'Keep the Endeavour', onClick: () => this.setState({ popup: null }) };
    if (p.kind === 'switch') {
      const r = byId[en.id];
      return { show: true, title: 'Fund ' + p.focus + ' instead?', body: 'The ' + r.name + ' Endeavour stops at ' + en.pct + '%. Its progress then decays slowly, and you can resume it later.',
        ok: { label: 'Fund ' + p.focus, onClick: () => this.stopEndeavour(p.focus) }, cancel: keep };
    }
    if (p.kind === 'stop') {
      return { show: true, title: 'Stop the Endeavour?', body: 'Its progress decays slowly; you can resume it later. Funding goes to ' + (this.state.queue[0] || 'no focus') + '.',
        ok: { label: 'Stop the Endeavour', onClick: () => this.stopEndeavour(null) }, cancel: keep };
    }
    const r = byId[p.id], pr = this.price(r), f = this.state.funded;
    const body = (p.kind === 'replace' ? 'Replace the Endeavour on ' + byId[en.id].name + '? It stops at ' + en.pct + '%; its progress decays slowly, and you can resume it later. ' : '') +
      'A Grand Endeavour on ' + r.name + ' takes the funded share, ' + fmt(this.share()) + ' a turn, for about ' + pr.turns + (pr.turns === 1 ? ' turn' : ' turns') + ': ' + fmt(pr.price) + ' Insight in all. It cannot fail.' + (f ? ' ' + f + ' goes back to the head of the queue.' : '');
    return { show: true, title: p.kind === 'replace' ? 'Replace the Endeavour?' : 'Begin a Grand Endeavour?', body: body,
      ok: { label: 'Begin Grand Endeavour', onClick: () => this.beginEndeavour(p.id) }, cancel: p.kind === 'replace' ? keep : { label: 'Cancel', onClick: () => this.setState({ popup: null }) } };
  }
}

</script>
</body>
</html>
